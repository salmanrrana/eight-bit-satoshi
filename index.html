<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-Bit Satoshi</title>
  <meta name="description" content="Play as Satoshi in a fast 8-bit platformer about building Bitcoin.">

  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="game-shell" aria-label="8-Bit Satoshi playable platformer">
    <section class="screen-frame" aria-label="Game screen">
      <canvas id="game-canvas" width="256" height="240" aria-label="8-Bit Satoshi game canvas"></canvas>

      <div id="hud" class="hud" aria-live="polite">
        <span id="hud-coins">BTC 00</span>
        <span id="hud-lives">LIVES 3</span>
        <span id="hud-zone">BROKEN WORLD</span>
      </div>

      <div id="hud-timer" class="hud-timer" role="timer" aria-label="Run time">0:00.00</div>

      <div id="title-screen" class="overlay title-screen">
        <div class="title-stack">
          <h1>8-BIT SATOSHI</h1>
          <p>Build Bitcoin. Beat fiat. Reach the whitepaper.</p>
          <div id="level-select" class="level-select" role="radiogroup" aria-label="Choose a level"></div>
          <button id="start-button" class="primary-button" type="button">START</button>
          <button id="leaderboard-button" class="primary-button secondary-button leaderboard-button" type="button">LEADERBOARD</button>
          <p id="title-rules" class="title-rules" aria-label="Timing rules"></p>
        </div>
      </div>

      <div id="message-screen" class="overlay message-screen hidden">
        <div class="message-box">
          <h2 id="message-title">PAUSED</h2>
          <p id="message-copy">Game paused.</p>
          <div id="message-results" class="message-results hidden" role="region" aria-label="Run results"></div>
          <div class="button-row">
            <button id="continue-button" class="primary-button" type="button">CONTINUE</button>
            <button id="restart-button" class="primary-button" type="button">RESTART</button>
            <button id="results-leaderboard-button" class="primary-button secondary-button hidden" type="button">LEADERBOARD</button>
            <button id="menu-button" class="primary-button secondary-button hidden" type="button">LEVELS</button>
          </div>
        </div>
      </div>

      <div id="leaderboard-screen" class="overlay leaderboard-screen hidden">
        <div class="leaderboard-box">
          <h2>LEADERBOARD</h2>
          <div id="leaderboard-tabs" class="leaderboard-tabs" role="tablist" aria-label="Choose a level leaderboard"></div>
          <div id="leaderboard-body" class="leaderboard-body" role="region" aria-live="polite" aria-label="Leaderboard rankings"></div>
          <div class="button-row">
            <button id="leaderboard-back" class="primary-button secondary-button" type="button">BACK</button>
          </div>
        </div>
      </div>

    </section>

    <div class="touch-controls" aria-label="Touch controls">
      <div class="direction-pad" aria-label="Move">
        <button class="touch-button" type="button" data-action="left" aria-label="Move left">&larr;</button>
        <button class="touch-button" type="button" data-action="right" aria-label="Move right">&rarr;</button>
      </div>
      <button class="touch-button jump-button" type="button" data-action="jump" aria-label="Jump">&uarr;</button>
    </div>
  </main>

  <script src="js/leaderboard-rules.js"></script>
  <script src="js/leaderboard-client.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
